name: Piano Fit Smoke

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:

jobs:
  smoke:
    name: Build and dry-run fitting pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Fix up git URLs
        run: echo -e '[url "https://github.com/"]\n  insteadOf = "git@github.com:"' >> ~/.gitconfig
        shell: bash

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build ladspa-sdk freeglut3-dev g++ libasound2-dev libcurl4-openssl-dev libfreetype6-dev libjack-jackd2-dev libx11-dev libxcomposite-dev libxcursor-dev libxinerama-dev libxrandr-dev mesa-common-dev libwebkit2gtk-4.1-dev xvfb

      - name: Install Poetry
        run: python3 -m pip install --user poetry

      - name: Install Python package
        run: |
          cd python
          poetry install --with train,wandb --no-interaction

      - name: Check Python package
        run: |
          cd python
          poetry check

      - name: Run Python tests
        run: |
          cd python
          poetry run python -m unittest discover -s tests

      - name: Configure PianoFit
        run: cmake -B build-fit -DCMAKE_BUILD_TYPE=Release -DBUILD_FIT_TOOLS=ON

      - name: Build PianoFit
        run: cmake --build build-fit --target PianoFit --config Release -j 2

      - name: Print model info
        run: ./build-fit/tools/piano_fit/PianoFit_artefacts/Release/PianoFit --print-model-info

      - name: Dry-run local smoke profile
        run: |
          cd python
          poetry run piano-fit train --config configs/local-smoke.yaml --dry-run
